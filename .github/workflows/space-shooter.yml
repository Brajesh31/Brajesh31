name: Space Shooter Contribution Game

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Generate and commit Space Shooter GIF
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: Brajesh31
          output-path: game.gif
          strategy: random

      - name: Recolor the contribution blocks blue
        shell: bash
        run: python scripts/recolor_blue.py --kind gif game.gif

      - name: Commit the blue Space Shooter GIF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- game.gif
          if git diff --cached --quiet; then
            echo "The blue GIF is already current."
            exit 0
          fi

          last_message="$(git log -1 --pretty=%s)"
          last_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          if [[ "$last_message" == "Update space shooter game GIF" && "$last_files" == "game.gif" ]]; then
            previous_sha="$(git rev-parse HEAD)"
            git commit --amend --no-edit
            git push --force-with-lease="main:$previous_sha" origin HEAD:main
          else
            git commit -m "Update space shooter game GIF"
            git push origin HEAD:main
          fi
