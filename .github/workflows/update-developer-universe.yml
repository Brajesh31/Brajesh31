name: Update Developer Universe Data

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: developer-universe-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh public GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/developer-universe/generate-public-data.mjs
      - name: Commit changed data
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: refresh developer universe data [skip ci]"
          file_pattern: world/public/data/github-profile.json
