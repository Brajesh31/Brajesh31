name: GitHub Achievements

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/github-achievements.yml'
      - '.github/metrics-custom/**'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  achievements:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      # Pin the upstream Projects V2 fix and layer the custom 30-achievement extension.
      - name: Checkout fixed Metrics source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lowlighter/metrics
          ref: 1e49d0b8b932624dd7762147e35ccc137eda09f1
          path: .metrics-action
          persist-credentials: false

      - name: Layer Projects V2 fix and custom 30-achievement source
        shell: bash
        run: |
          cp .github/metrics-custom/achievements.graphql .metrics-action/source/plugins/achievements/queries/achievements.graphql
          cp .github/metrics-custom/users.mjs .metrics-action/source/plugins/achievements/list/users.mjs
          cat > .metrics-action/Dockerfile <<'EOF'
          FROM ghcr.io/lowlighter/metrics:v3.35-beta
          COPY source/plugins/achievements/queries/achievements.graphql /metrics/source/plugins/achievements/queries/achievements.graphql
          COPY source/plugins/achievements/list/users.mjs /metrics/source/plugins/achievements/list/users.mjs
          EOF

      - name: Verify private and public repository access
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        shell: bash
        run: |
          if ! repo_visibility=$(gh api --paginate 'user/repos?visibility=all&affiliation=owner&per_page=100' --jq '.[].private' 2>&1); then
            echo "::error::Unable to read repository visibility with METRICS_TOKEN."
            echo "$repo_visibility"
            echo "Grant the token access to private repositories (classic PAT: repo scope; fine-grained PAT: repository access plus Metadata read and Contents read)."
            exit 1
          fi
          private_count=$(printf '%s\n' "$repo_visibility" | grep -c '^true$' || true)
          public_count=$(printf '%s\n' "$repo_visibility" | grep -c '^false$' || true)
          echo "Accessible owned repositories: $public_count public, $private_count private"
      - name: Generate GitHub Achievements card
        uses: ./.metrics-action
        with:
          use_prebuilt_image: no
          filename: metrics/metrics-achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          committer_message: 'chore: update GitHub achievements card [Skip GitHub Action]'
          user: Brajesh31
          template: classic
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: X
          plugin_fortune: yes
          config_timezone: Asia/Kolkata
          config_octicon: yes
          config_twemoji: yes
          plugins_errors_fatal: yes
