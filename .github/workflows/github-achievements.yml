name: GitHub Achievements

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  achievements:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout fixed Metrics source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lowlighter/metrics
          ref: 1e49d0b8b932624dd7762147e35ccc137eda09f1
          path: .metrics-action
          persist-credentials: false

      - name: Add xz utility required by Metrics image build
        shell: bash
        run: |
          sed -i 's/pkg-config libssl-dev/pkg-config libssl-dev xz-utils/' .metrics-action/Dockerfile
          grep -q 'pkg-config libssl-dev xz-utils' .metrics-action/Dockerfile

      - name: Generate GitHub Achievements card
        uses: ./.metrics-action
        with:
          use_prebuilt_image: no
          filename: metrics/metrics-achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          committer_message: 'chore: update GitHub achievements card [Skip GitHub Action]'
          user: Brajesh31
          template: classic
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: X
          plugin_fortune: yes
          config_timezone: Asia/Kolkata
          config_octicon: yes
          config_twemoji: yes
          plugins_errors_fatal: yes
          debug: yes
