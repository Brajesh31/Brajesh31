name: GitHub Activity Globe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/github-activity-globe.yml
      - scripts/generate_github_activity_globe.py
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-activity-globe
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install image dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Generate animated contribution globe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Brajesh31
        run: python3 scripts/generate_github_activity_globe.py

      - name: Update profile README embed
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          start = "<!-- GITHUB-ACTIVITY-GLOBE:START -->"
          end = "<!-- GITHUB-ACTIVITY-GLOBE:END -->"
          if start not in content or end not in content:
              raise SystemExit("Globe markers are missing from README.md")
          before, remainder = content.split(start, 1)
          _, after = remainder.split(end, 1)
          section = """
          <p align="center">
            <img src="./assets/github-activity-globe.gif" width="100%" alt="Animated rotating GitHub Activity Globe showing Brajesh31's contribution activity" />
          </p>
          """
          content = before + start + section + end + after
          readme.write_text(content, encoding="utf-8")
          PY

      - name: Commit updated animated globe and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity-globe.gif README.md
          if git diff --cached --quiet; then
            echo "The animated globe and README are already up to date."
            exit 0
          fi
          git commit -m "chore: update animated GitHub activity globe [skip ci]"

          # Another workflow run or a manual commit may update main while this
          # job is rendering the GIF. Rebase and retry instead of losing the push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed because main moved. Retrying..."
            sleep $((attempt * 2))
          done

          echo "Could not push the generated globe after 5 attempts."
          exit 1
