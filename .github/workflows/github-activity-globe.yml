name: GitHub Activity Globe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/github-activity-globe.yml
      - scripts/generate_github_activity_globe.py
      - scripts/render_github_globe.js
      - scripts/globe-template.html
      - scripts/capture_github_globe.py
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-activity-globe
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependencies
        run: |
          npm install --no-save three@0.128.0 three-globe@2.18.8 esbuild@0.24.2
          python -m pip install --disable-pip-version-check Pillow playwright==1.49.1
          python -m playwright install --with-deps chromium
      - name: Fetch and validate contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Brajesh31
        run: python scripts/generate_github_activity_globe.py
      - name: Bundle Three.js globe
        run: |
          cp scripts/globe-template.html globe-template.html
          cp scripts/render_github_globe.js src.js
          npx esbuild src.js --bundle --format=esm --outfile=public.js
          sed -i 's#src="/src.js"#src="/public.js"#' globe-template.html
          mkdir -p site
          mv globe-template.html site/index.html
          mv public.js site/public.js
          cp assets/github-contributions.json site/github-contributions.json
      - name: Render true 3D globe frames as GIF
        run: |
          python -m http.server 4173 --directory site > /tmp/globe-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python scripts/capture_github_globe.py
      - name: Commit generated assets without rebase conflicts
        run: |
          mkdir -p /tmp/generated-globe
          cp assets/github-activity-globe.gif /tmp/generated-globe/
          cp assets/github-contributions.json /tmp/generated-globe/
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/generated-globe/github-activity-globe.gif assets/
          cp /tmp/generated-globe/github-contributions.json assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity-globe.gif assets/github-contributions.json
          if git diff --cached --quiet; then
            echo "Generated GitGlobe assets are already up to date"
            exit 0
          fi
          git commit -m "chore: refresh 3D GitGlobe animation [skip ci]"
          git push origin HEAD:main
