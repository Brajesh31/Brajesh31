name: GitHub Activity Globe

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-activity-globe
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution globe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Brajesh31
        run: python3 scripts/generate_github_activity_globe.py

      - name: Commit updated globe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity-globe.svg
          if git diff --cached --quiet; then
            echo "The activity globe is already up to date."
            exit 0
          fi
          git commit -m "chore: update GitHub activity globe [skip ci]"
          git push
