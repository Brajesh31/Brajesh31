name: GitHub Activity Globe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/github-activity-globe.yml
      - scripts/generate_github_activity_globe.py
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-activity-globe
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution globe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Brajesh31
        run: python3 scripts/generate_github_activity_globe.py

      - name: Add globe to profile README
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          marker = "<!-- GITHUB-ACTIVITY-GLOBE:START -->"
          if marker not in content:
              section = "\n".join([
                  "## 🌍 GitHub Activity Globe",
                  "",
                  "A spherical view of my GitHub contribution activity over the last 12 months. Each illuminated point represents a day with contributions, with brighter points indicating higher activity.",
                  "",
                  '<p align="center">',
                  '  <img src="./assets/github-activity-globe.svg" width="100%" alt="GitHub Activity Globe showing Brajesh31 contribution activity over the last 12 months" />',
                  '</p>',
                  "",
                  "<!-- GITHUB-ACTIVITY-GLOBE:START -->",
                  "<!-- GITHUB-ACTIVITY-GLOBE:END -->",
                  "",
                  ""
              ])
              anchor = "## 📊 Contribution Graph"
              if anchor not in content:
                  raise SystemExit("Could not find the Contribution Graph heading in README.md")
              content = content.replace(anchor, section + anchor, 1)
              readme.write_text(content, encoding="utf-8")
          PY

      - name: Commit updated globe and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity-globe.svg README.md
          if git diff --cached --quiet; then
            echo "The activity globe and README are already up to date."
            exit 0
          fi
          git commit -m "chore: update GitHub activity globe [skip ci]"
          git push
