<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Developer impact dashboard</title><desc id="desc">A live-data dashboard frame linking to GitHub statistics cards below.</desc><rect width="900" height="250" rx="22" fill="#0b1020" stroke="#27345f"/><g fill="#111a35" stroke="#304370"><rect x="28" y="90" width="155" height="110" rx="12"/><rect x="205" y="90" width="155" height="110" rx="12"/><rect x="382" y="90" width="155" height="110" rx="12"/><rect x="559" y="90" width="155" height="110" rx="12"/><rect x="736" y="90" width="136" height="110" rx="12"/></g><g fill="#00d9ff" font-family="monospace" text-anchor="middle"><text x="450" y="40" font-size="22">DEVELOPER IMPACT DASHBOARD</text><text x="450" y="65" font-size="11" fill="#8aa7c7">Live GitHub cards below provide repositories, contributions, PRs, issues, stars, followers and languages.</text><text x="105" y="125" font-size="14">REPOS</text><text x="282" y="125" font-size="14">CONTRIB</text><text x="459" y="125" font-size="14">PRS</text><text x="636" y="125" font-size="14">ISSUES</text><text x="804" y="125" font-size="14">STARS</text><text x="105" y="165" font-size="12" fill="#9bdcff">GitHub live</text><text x="282" y="165" font-size="12" fill="#9bdcff">GitHub live</text><text x="459" y="165" font-size="12" fill="#9bdcff">GitHub live</text><text x="636" y="165" font-size="12" fill="#9bdcff">GitHub live</text><text x="804" y="165" font-size="12" fill="#9bdcff">GitHub live</text></g></svg>
