<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Coding Mountain</title><desc id="desc">Pixel-inspired coding mountain with thematic checkpoints.</desc>
  <rect width="900" height="280" rx="22" fill="#10152b"/><path fill="#1a2450" d="M0 240L220 70l110 90L470 35l180 205z"/><path fill="#263867" d="M230 240l240-205 205 205z"/><path fill="#00d9ff" d="M470 35l-35 42h70z"/><g fill="#ffcc66"><circle cx="220" cy="160" r="7"/><circle cx="360" cy="120" r="7"/><circle cx="470" cy="78" r="7"/><circle cx="610" cy="160" r="7"/></g><g fill="#e7f7ff" font-family="monospace" text-anchor="middle"><text x="220" y="190" font-size="12">FOUNDATIONS</text><text x="360" y="100" font-size="12">SYSTEMS</text><text x="470" y="25" font-size="12">SHIP</text><text x="610" y="190" font-size="12">SHARE</text><text x="32" y="40" text-anchor="start" font-size="22" fill="#9b6cff">CODING MOUNTAIN</text><text x="32" y="64" text-anchor="start" font-size="12" fill="#8aa7c7">Checkpoints represent the journey map themes, not performance scores.</text></g></svg>
