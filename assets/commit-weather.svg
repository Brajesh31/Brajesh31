  <title id="title">Commit Weather</title><desc id="desc">Creative coding activity forecast based on contribution signals.</desc><rect width="430" height="280" rx="22" fill="#10152b" stroke="#27345f"/><circle cx="150" cy="145" r="38" fill="#ffcc66"/><g stroke="#ffcc66" stroke-width="5"><path d="M150 88v-20M150 222v20M93 145H73M227 145h20"/></g><path d="M150 170c28-45 95-38 105 3 28-5 52 16 48 43H125c-14-26 1-48 25-46z" fill="#263867" stroke="#00d9ff" stroke-width="3"/><g fill="#e7f7ff" font-family="monospace"><text x="30" y="38" font-size="20" fill="#00d9ff">COMMIT WEATHER</text><text x="30" y="65" font-size="11" fill="#8aa7c7">creative activity forecast, never literal weather</text><text x="270" y="142" font-size="17">BUILDING</text><text x="270" y="165" font-size="13" fill="#9bdcff">signals detected</text><text x="30" y="260" font-size="11" fill="#8aa7c7">Uses contribution/activity visuals already present.</text></g>  </g>
