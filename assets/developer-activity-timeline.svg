  <title id="title">Developer activity timeline</title><desc id="desc">A timeline view distinct from the GitHub contribution calendar.</desc><rect width="900" height="220" rx="22" fill="#10152b" stroke="#27345f"/><path d="M80 135H820" stroke="#00d9ff" stroke-width="4"/><g fill="#9b6cff" stroke="#e7f7ff" stroke-width="2"><circle cx="145" cy="135" r="12"/><circle cx="320" cy="135" r="12"/><circle cx="505" cy="135" r="12"/><circle cx="690" cy="135" r="12"/><circle cx="805" cy="135" r="12"/></g>  <g fill="#e7f7ff" font-family="monospace" text-anchor="middle"><text x="30" y="38" text-anchor="start" font-size="20" fill="#00d9ff">DEVELOPER ACTIVITY TIMELINE</text><text x="30" y="62" text-anchor="start" font-size="11" fill="#8aa7c7">Repository themes and existing GitHub activity integrations, not invented event counts</text><text x="145" y="105" font-size="12">PROJECTS</text><text x="320" y="105" font-size="12">AI / ML</text><text x="505" y="105" font-size="12">OTEL</text><text x="690" y="105" font-size="12">COMMUNITY</text><text x="805" y="105" font-size="12">ACTIVITY</text></g></svg>
