<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Developer DNA</title><desc id="desc">Animated developer identity map for Brajesh Kumar.</desc>
